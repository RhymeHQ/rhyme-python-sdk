[project]
name = "rhyme-sdk"
version = "0.1.2"
description = "Python client for the Rhyme Agent API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rhyme" }]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2,<3",
    "pydantic>=2.11,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/RhymeHQ/rhyme-python-sdk"
Issues = "https://github.com/RhymeHQ/rhyme-python-sdk/issues"
Changelog = "https://github.com/RhymeHQ/rhyme-python-sdk/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rhyme"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN001", "ANN201", "ANN202"]

[tool.ruff.lint.isort]
known-first-party = ["rhyme"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
